[project]
name = "burnrate"
version = "0.1.0"
description = "Blackbox SLO monitoring with multi-window multi-burn-rate error-budget alerting"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
burnrate = "burnrate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["burnrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
