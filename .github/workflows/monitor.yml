# Probing from a scheduled job, which is a compromise and worth being precise
# about.
#
# A monitor wants to be a daemon. This is a cron entry that gets five minutes
# an hour, so the history it builds is sampled and bursty rather than
# continuous: roughly 120 probes per target per day instead of 1,440. That is
# enough for the 1-day and 2-hour windows the ticket rule uses, and it is not
# enough for the 1-hour/5-minute page rule, which will only ever see the
# samples taken inside a single run. The alert engine already refuses to judge
# a window holding fewer than `min_samples` probes, so the thin windows go
# quiet instead of going wrong.
#
# What it buys: the SLO numbers in the report stop being minutes old, and
# nothing has to be left running on a laptop.
name: monitor

on:
  schedule:
    # Seventeen past, not on the hour. Everybody's cron fires at :00 and
    # GitHub queues scheduled runs behind that spike.
    - cron: "17 * * * *"
  workflow_dispatch:

# Never two at once: they would write the same SQLite file from two runners
# and the second would restore a cache the first is about to replace.
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      # The history has to outlive the runner. A unique key so every run
      # writes a new entry, and restore-keys so it picks up the newest one
      # that exists. If the cache is ever evicted the history restarts, which
      # is a real limitation of doing this here rather than on a host.
      - name: Restore the history
        uses: actions/cache@v4
        with:
          path: burnrate.db
          key: burnrate-db-${{ github.run_id }}
          restore-keys: burnrate-db-

      - name: Probe for five minutes
        # Five ticks at the configured 60s interval. `run` rather than `once`
        # so a single scheduled job still produces a window with enough
        # samples in it to be evaluated at all.
        run: burnrate run --no-metrics --for 300

      - name: Publish the report
        if: always()
        run: burnrate report >> "$GITHUB_STEP_SUMMARY"
